<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polymarket Arb Dashboard</title>
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2332;
    --border: #1e2d3d;
    --text: #e2e8f0;
    --text-dim: #8892a4;
    --green: #10b981;
    --red: #ef4444;
    --blue: #3b82f6;
    --yellow: #f59e0b;
    --purple: #8b5cf6;
    --cyan: #06b6d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header .meta { color: var(--text-dim); font-size: 12px; }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  .status-dot.live { background: var(--green); }
  .status-dot.dry { background: var(--yellow); }
  .status-dot.stopped { background: var(--red); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    padding: 16px 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .metric {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .metric:last-child { border-bottom: none; }
  .metric .label { color: var(--text-dim); }
  .metric .value { font-weight: 600; }
  .metric .value.positive { color: var(--green); }
  .metric .value.negative { color: var(--red); }
  .wide { grid-column: 1 / -1; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
    font-size: 11px;
  }
  td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  tr:hover { background: var(--surface2); }
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-green { background: rgba(16,185,129,0.15); color: var(--green); }
  .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
  .badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .badge-purple { background: rgba(139,92,246,0.15); color: var(--purple); }
  .chart-container {
    height: 160px;
    position: relative;
    margin-top: 8px;
  }
  canvas { width: 100% !important; height: 100% !important; }
  .empty-state {
    color: var(--text-dim);
    text-align: center;
    padding: 24px;
    font-size: 12px;
  }
  .bar-track { background: var(--surface2); height: 6px; border-radius: 3px; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .bar-fill.green { background: var(--green); }
  .bar-fill.blue { background: var(--blue); }
  .bar-fill.yellow { background: var(--yellow); }
  .bar-fill.red { background: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Polymarket Arb Dashboard</h1>
  </div>
  <div class="meta">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">连接中…</span>
    &nbsp;|&nbsp; 运行 <span id="uptime">-</span>
    &nbsp;|&nbsp; 周期 #<span id="cycleCount">0</span>
    &nbsp;|&nbsp; 刷新 <span id="lastUpdate">-</span>
  </div>
</div>

<div class="grid">

  <!-- 核心指标 -->
  <div class="card">
    <h2>核心指标</h2>
    <div class="metric"><span class="label">发现套利</span><span class="value" id="arbsFound">0</span></div>
    <div class="metric"><span class="label">已执行</span><span class="value" id="arbsExecuted">0</span></div>
    <div class="metric"><span class="label">扫描市场数</span><span class="value" id="marketsScanned">0</span></div>
    <div class="metric"><span class="label">执行率</span><span class="value" id="execRate">-</span></div>
  </div>

  <!-- 风控状态 -->
  <div class="card">
    <h2>风控状态</h2>
    <div class="metric">
      <span class="label">状态</span>
      <span class="value" id="riskStatus">-</span>
    </div>
    <div class="metric">
      <span class="label">持仓数</span>
      <span class="value" id="openPositions">-</span>
    </div>
    <div class="metric">
      <span class="label">总敞口</span>
      <span class="value" id="totalExposure">-</span>
    </div>
    <div class="metric">
      <span class="label">日盈亏</span>
      <span class="value" id="dailyPnl">-</span>
    </div>
    <div class="metric">
      <span class="label">连续失败</span>
      <span class="value" id="consecutiveFails">0</span>
    </div>
  </div>

  <!-- 策略分配 -->
  <div class="card">
    <h2>策略资金分配</h2>
    <div id="strategyBars"></div>
  </div>

  <!-- P&L 走势 -->
  <div class="card wide">
    <h2>累计盈亏走势</h2>
    <div class="chart-container">
      <canvas id="pnlChart"></canvas>
    </div>
  </div>

  <!-- 最近套利机会 -->
  <div class="card wide">
    <h2>最近套利机会</h2>
    <div id="oppTable"></div>
  </div>

  <!-- 最近交易 -->
  <div class="card wide">
    <h2>最近交易</h2>
    <div id="tradeTable"></div>
  </div>

  <!-- 最近错误 -->
  <div class="card">
    <h2>最近错误</h2>
    <div id="errorList"></div>
  </div>

</div>

<script>
const API = '/api/status';
let pnlCanvas, pnlCtx;

function $(id) { return document.getElementById(id); }

function formatPnl(v) {
  const s = v >= 0 ? '+' : '';
  return s + '$' + v.toFixed(2);
}

function pnlClass(v) {
  return v >= 0 ? 'positive' : 'negative';
}

function renderStatus(d) {
  // Header
  const dot = $('statusDot');
  const txt = $('statusText');
  if (!d.is_running) {
    dot.className = 'status-dot stopped';
    txt.textContent = '已停止';
  } else if (d.is_dry_run) {
    dot.className = 'status-dot dry';
    txt.textContent = 'DRY RUN';
  } else {
    dot.className = 'status-dot live';
    txt.textContent = 'LIVE';
  }
  $('uptime').textContent = d.uptime_human || '-';
  $('cycleCount').textContent = d.cycle_count;
  $('lastUpdate').textContent = new Date().toLocaleTimeString();

  // Metrics
  $('arbsFound').textContent = d.arbs_found;
  $('arbsExecuted').textContent = d.arbs_executed;
  $('marketsScanned').textContent = d.markets_scanned;
  const rate = d.arbs_found > 0 ? ((d.arbs_executed / d.arbs_found) * 100).toFixed(1) + '%' : '-';
  $('execRate').textContent = rate;

  // Risk
  const r = d.risk_state || {};
  const halted = r.is_halted || false;
  $('riskStatus').innerHTML = halted
    ? '<span class="badge badge-red">已暂停</span>'
    : '<span class="badge badge-green">正常</span>';
  $('openPositions').textContent = (r.open_positions || 0) + '/' + (r.max_positions || '-');
  $('totalExposure').textContent = '$' + (r.total_exposure || 0).toFixed(2);
  const pnl = r.daily_pnl || 0;
  const pnlEl = $('dailyPnl');
  pnlEl.textContent = formatPnl(pnl);
  pnlEl.className = 'value ' + pnlClass(pnl);
  $('consecutiveFails').textContent = r.consecutive_failures || 0;

  // Strategies
  renderStrategies(d.strategy_status || {});

  // Tables
  renderOpportunities(d.recent_opportunities || []);
  renderTrades(d.recent_trades || []);
  renderErrors(d.recent_errors || []);

  // Chart
  renderPnlChart(d.pnl_history || []);
}

function renderStrategies(s) {
  const container = $('strategyBars');
  if (!s || Object.keys(s).length === 0) {
    container.innerHTML = '<div class="empty-state">等待策略数据…</div>';
    return;
  }
  const tiers = [
    { key: 'T0', name: '结构性套利', color: 'green' },
    { key: 'T1', name: '跨平台', color: 'blue' },
    { key: 'T2', name: '统计套利', color: 'purple' },
    { key: 'T3', name: '做市', color: 'yellow' },
  ];
  let html = '';
  for (const t of tiers) {
    const data = s[t.key] || {};
    const pct = data.allocation_pct || 0;
    const used = data.current_exposure || 0;
    const budget = data.budget || 0;
    const fillPct = budget > 0 ? Math.min(100, (used / budget) * 100) : 0;
    html += `<div class="metric"><span class="label">${t.key} ${t.name}</span>
      <span class="value">${pct > 0 ? (pct * 100).toFixed(0) + '%' : '-'}</span></div>
      <div class="bar-track"><div class="bar-fill ${t.color}" style="width:${fillPct}%"></div></div>`;
  }
  container.innerHTML = html;
}

function renderOpportunities(opps) {
  const el = $('oppTable');
  if (!opps.length) { el.innerHTML = '<div class="empty-state">暂无套利机会</div>'; return; }
  let html = '<table><tr><th>时间</th><th>类型</th><th>事件</th><th>成本</th><th>净利</th><th>利润率</th><th>置信度</th></tr>';
  for (const o of opps.slice(-15).reverse()) {
    const t = o.timestamp ? new Date(o.timestamp * 1000).toLocaleTimeString() : '-';
    const type = o.arb_type === 'binary'
      ? '<span class="badge badge-blue">二元</span>'
      : '<span class="badge badge-purple">多结果</span>';
    html += `<tr><td>${t}</td><td>${type}</td><td>${(o.event_title || '').slice(0, 40)}</td>
      <td>$${(o.total_cost || 0).toFixed(4)}</td>
      <td class="${pnlClass(o.net_edge || 0)}">${formatPnl(o.net_edge || 0)}</td>
      <td>${(o.edge_pct || 0).toFixed(2)}%</td>
      <td>${((o.confidence || 0) * 100).toFixed(0)}%</td></tr>`;
  }
  el.innerHTML = html + '</table>';
}

function renderTrades(trades) {
  const el = $('tradeTable');
  if (!trades.length) { el.innerHTML = '<div class="empty-state">暂无交易记录</div>'; return; }
  let html = '<table><tr><th>时间</th><th>方向</th><th>结果</th><th>价格</th><th>数量</th><th>状态</th></tr>';
  for (const t of trades.slice(-15).reverse()) {
    const ts = t.timestamp ? new Date(t.timestamp * 1000).toLocaleTimeString() : '-';
    const side = t.side === 'BUY'
      ? '<span class="badge badge-green">BUY</span>'
      : '<span class="badge badge-red">SELL</span>';
    const status = t.status === 'filled'
      ? '<span class="badge badge-green">已成交</span>'
      : t.status === 'failed'
        ? '<span class="badge badge-red">失败</span>'
        : `<span class="badge badge-yellow">${t.status}</span>`;
    html += `<tr><td>${ts}</td><td>${side}</td><td>${(t.outcome || t.token_id || '').slice(0, 24)}</td>
      <td>$${(t.price || 0).toFixed(4)}</td><td>${(t.size || 0).toFixed(2)}</td><td>${status}</td></tr>`;
  }
  el.innerHTML = html + '</table>';
}

function renderErrors(errors) {
  const el = $('errorList');
  if (!errors.length) { el.innerHTML = '<div class="empty-state">无错误</div>'; return; }
  let html = '';
  for (const e of errors.slice(-5).reverse()) {
    const ts = e.timestamp ? new Date(e.timestamp * 1000).toLocaleTimeString() : '';
    html += `<div class="metric"><span class="label">${ts}</span><span class="value negative" style="font-size:11px">${(e.message || '').slice(0, 60)}</span></div>`;
  }
  el.innerHTML = html;
}

function renderPnlChart(history) {
  if (!pnlCanvas) return;
  const ctx = pnlCtx;
  const W = pnlCanvas.width = pnlCanvas.offsetWidth * 2;
  const H = pnlCanvas.height = pnlCanvas.offsetHeight * 2;
  ctx.clearRect(0, 0, W, H);

  if (history.length < 2) {
    ctx.fillStyle = '#8892a4';
    ctx.font = '24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('等待数据…', W / 2, H / 2);
    return;
  }

  const values = history.map(h => h.cumulative_pnl || 0);
  const minV = Math.min(0, ...values);
  const maxV = Math.max(0.01, ...values);
  const range = maxV - minV || 0.01;
  const padY = 20;

  const toX = (i) => (i / (values.length - 1)) * W;
  const toY = (v) => H - padY - ((v - minV) / range) * (H - padY * 2);

  // Zero line
  const zeroY = toY(0);
  ctx.strokeStyle = '#1e2d3d';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(0, zeroY);
  ctx.lineTo(W, zeroY);
  ctx.stroke();
  ctx.setLineDash([]);

  // PnL line
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(values[0]));
  for (let i = 1; i < values.length; i++) {
    ctx.lineTo(toX(i), toY(values[i]));
  }
  const last = values[values.length - 1];
  ctx.strokeStyle = last >= 0 ? '#10b981' : '#ef4444';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Fill
  ctx.lineTo(toX(values.length - 1), zeroY);
  ctx.lineTo(toX(0), zeroY);
  ctx.closePath();
  ctx.fillStyle = last >= 0 ? 'rgba(16,185,129,0.08)' : 'rgba(239,68,68,0.08)';
  ctx.fill();

  // Label
  ctx.fillStyle = last >= 0 ? '#10b981' : '#ef4444';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(formatPnl(last), W - 10, 30);
}

async function refresh() {
  try {
    const resp = await fetch(API);
    const data = await resp.json();
    renderStatus(data);
  } catch (e) {
    $('statusDot').className = 'status-dot stopped';
    $('statusText').textContent = '连接断开';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  pnlCanvas = $('pnlChart');
  pnlCtx = pnlCanvas.getContext('2d');
  refresh();
  setInterval(refresh, 3000);
});
</script>
</body>
</html>
